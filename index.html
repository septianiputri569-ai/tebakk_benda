<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tebak cepat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe6f7;--ink:#182747;--sun:#ffc93c;--leaf:#2fb380;--berry:#e5484d;--paper:#fffdf6}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:600;min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:460px;display:grid;gap:16px;align-content:start}
h1,h2{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;line-height:1;margin:0}
h1{font-size:2.2rem}
h2{font-size:1.8rem}
p{margin:0;line-height:1.5}
[hidden]{display:none!important}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;display:grid;gap:12px}
.small{font-size:.9rem;opacity:.75}
.stats{display:flex;gap:10px}
.pill{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800}
.hearts{color:var(--berry);letter-spacing:2px}
.arena{display:grid;gap:14px}
.top{display:flex;align-items:center;gap:16px}
.badge{width:110px;height:110px;display:grid;place-items:center;background:var(--sun);border:3px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:4.6rem;line-height:1}
.sisa{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:3rem;line-height:1}
.sisa small{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:.95rem;font-weight:700}
.bar{height:18px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--leaf)}
.bar.low i{background:var(--berry)}
input{width:100%;font:inherit;font-weight:800;font-size:1.3rem;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
input:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.row{display:flex;gap:10px}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:12px 18px;background:var(--sun);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.msg{min-height:3.4rem;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--paper);line-height:1.4;display:flex;align-items:center}
.msg.ok{background:#c9f0de}
.msg.no{background:#ffd9d9}
</style>
</head>
<body>
<main>
  <h1>Tebak cepat</h1>

  <section class="card" id="intro">
    <p>Kamu dapat satu huruf. Ketik satu nama benda yang diawali huruf itu sebelum 5 detik habis. Kamu punya 3 nyawa.</p>
    <button class="btn" id="mulai">Mulai main</button>
    <p class="small">Rekor terbaik: <span id="rekor">0</span></p>
  </section>

  <section id="play" class="arena" hidden>
    <div class="stats">
      <div class="pill">Skor <span id="skor">0</span></div>
      <div class="pill">Nyawa <span class="hearts" id="nyawa">♥♥♥</span></div>
    </div>
    <div class="top">
      <div class="badge" id="huruf">?</div>
      <div class="sisa"><span id="detik">5</span><small>detik lagi</small></div>
    </div>
    <div class="bar" id="bar"><i id="bari"></i></div>
    <input id="jawab" type="text" placeholder="Ketik nama benda" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Jawaban">
    <div class="row">
      <button class="btn" id="kirim" style="flex:1">Jawab</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="card" id="over" hidden>
    <h2>Selesai</h2>
    <p>Skor kamu <b id="skorAkhir">0</b>. Rekor terbaik <b id="rekorAkhir">0</b>.</p>
    <button class="btn" id="lagi">Main lagi</button>
  </section>
</main>

<script>
const HURUF = 'ABCDEGHIJKLMNOPRSTUW'.split('');
const WAKTU = 5000, NYAWA = 3;
const $ = id => document.getElementById(id);

let skor, nyawa, huruf = '', mulaiT, timer, dipakai, aktif = false, rekor = 0;
try { rekor = +localStorage.getItem('tebakCepatRekor') || 0; } catch (e) {}
$('rekor').textContent = rekor;

function setMsg(t, k = '') { const m = $('msg'); m.textContent = t; m.className = 'msg ' + k; }
function tampilNyawa() { $('nyawa').textContent = '♥'.repeat(nyawa) + '♡'.repeat(NYAWA - nyawa); }

function mulaiGame() {
  skor = 0; nyawa = NYAWA; dipakai = new Set();
  $('skor').textContent = 0; tampilNyawa();
  $('intro').hidden = true; $('over').hidden = true; $('play').hidden = false;
  ronde();
}

function ronde() {
  let next;
  do { next = HURUF[Math.floor(Math.random() * HURUF.length)]; } while (next === huruf);
  huruf = next;
  $('huruf').textContent = huruf;
  $('jawab').value = '';
  $('jawab').focus();
  setMsg('Ketik benda berawalan ' + huruf + '.');
  aktif = true;
  mulaiT = performance.now();
  clearInterval(timer);
  timer = setInterval(tick, 50);
  tick();
}

function tick() {
  const sisa = WAKTU - (performance.now() - mulaiT);
  $('bari').style.width = Math.max(0, sisa / WAKTU * 100) + '%';
  $('bar').classList.toggle('low', sisa < 1500);
  $('detik').textContent = Math.max(0, Math.ceil(sisa / 1000));
  if (sisa <= 0 && aktif) salah('Waktu habis!');
}

function benar(w) {
  aktif = false; clearInterval(timer);
  skor++; dipakai.add(w);
  $('skor').textContent = skor;
  setMsg('Benar! ' + w + ' diawali ' + huruf + '.', 'ok');
  setTimeout(ronde, 800);
}

function salah(pesan) {
  aktif = false; clearInterval(timer);
  nyawa--; tampilNyawa();
  setMsg(pesan + ' Nyawa berkurang.', 'no');
  setTimeout(nyawa <= 0 ? selesai : ronde, 1300);
}

function selesai() {
  if (skor > rekor) {
    rekor = skor;
    try { localStorage.setItem('tebakCepatRekor', rekor); } catch (e) {}
  }
  $('rekor').textContent = rekor;
  $('skorAkhir').textContent = skor;
  $('rekorAkhir').textContent = rekor;
  $('play').hidden = true; $('over').hidden = false;
}

function kirim() {
  if (!aktif) return;
  const w = $('jawab').value.trim().toLowerCase();
  if (!w) return;
  if (!/^[a-z ]{3,}$/.test(w)) { setMsg('Tulis nama benda pakai huruf saja, minimal 3 huruf.', 'no'); return; }
  if (dipakai.has(w)) { setMsg('Kata itu sudah dipakai. Cari yang lain.', 'no'); return; }
  if (w[0].toUpperCase() !== huruf) { salah('"' + w + '" tidak diawali ' + huruf + '.'); return; }
  benar(w);
}

$('mulai').addEventListener('click', mulaiGame);
$('lagi').addEventListener('click', mulaiGame);
$('kirim').addEventListener('click', kirim);
$('jawab').addEventListener('keydown', e => { if (e.key === 'Enter') kirim(); });
</script>
</body>
</html>
